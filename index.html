<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Missão Pixel - Jogo do Labirinto</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070b14;
            --blue-deep: #0f1b38;
            --blue-mid: #1b2d58;
            --blue-light: #2d4a8d;
            --red-bright: #ff2a4b;
            --red-deep: #b3102c;
            --red-glow: rgba(255, 42, 75, 0.45);
            --white: #ffffff;
            --pixel-size: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            /* Remove o flash cinzento ao tocar em botões no telemóvel */
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 30%, #162244 0%, var(--bg-dark) 80%);
            color: var(--white);
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
            image-rendering: pixelated;
        }

        /* Linhas de scanline CRT retrô sutis */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 99;
            opacity: 0.6;
        }

        .game-wrapper {
            width: 100%;
            max-width: 580px;
            position: relative;
            z-index: 10;
        }

        /* Estilo de moldura Pixel Art */
        .pixel-box {
            background-color: var(--blue-deep);
            border: 4px solid #000;
            box-shadow: 0 0 0 4px var(--blue-mid), 0 0 0 8px #000, 0 12px 30px rgba(0, 0, 0, 0.8);
            padding: 32px 24px;
            text-align: center;
            display: none;
            animation: popIn 0.25s steps(3);
        }

        .pixel-box.active {
            display: block;
        }

        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 1.25rem;
            color: var(--red-bright);
            line-height: 1.6;
            margin-bottom: 24px;
            text-shadow: 3px 3px 0px #000, -2px -2px 0px var(--blue-mid);
        }

        p {
            font-size: 0.72rem;
            line-height: 1.9;
            color: #e0e6f5;
            margin-bottom: 24px;
            text-shadow: 2px 2px 0px #000;
        }

        /* Botão estilo 8-bit */
        .pixel-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            background: var(--red-bright);
            color: #fff;
            border: 4px solid #000;
            padding: 16px 24px;
            cursor: pointer;
            box-shadow: inset -4px -4px 0px var(--red-deep), inset 4px 4px 0px #ff7b92, 4px 4px 0px #000;
            transition: transform 0.08s steps(2);
            text-transform: uppercase;
            display: inline-block;
            touch-action: manipulation; /* CORREÇÃO: Remove zoom ao clicar rápido */
        }

        .pixel-btn:hover {
            background: #ff3e5c;
        }

        .pixel-btn:active {
            transform: translate(4px, 4px);
            box-shadow: inset 4px 4px 0px var(--red-deep), 0px 0px 0px #000;
        }

        /* ============================================================
           PÁGINA 2: O LABIRINTO
        ============================================================ */
        .maze-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .maze-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--red-bright);
            margin-bottom: 8px;
        }

        #mazeCanvas {
            background-color: #000;
            border: 4px solid #000;
            box-shadow: 0 0 0 4px var(--red-bright);
            image-rendering: pixelated;
            max-width: 100%;
            height: auto;
        }

        /* D-PAD para telemóveis / cliques */
        .dpad {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 45px);
            gap: 6px;
            justify-content: center;
        }

        .dpad-btn {
            background: var(--blue-mid);
            border: 3px solid #000;
            color: var(--white);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 2px 2px 0px var(--blue-light), inset -2px -2px 0px #091024, 2px 2px 0px #000;
            touch-action: manipulation; /* CORREÇÃO: Impede o zoom do ecrã ao clicar rápido nas setas */
        }

        .dpad-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
            background: var(--red-deep);
        }

        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }

        /* ============================================================
           PÁGINA 3: BORDA ANIMADA E CORAÇÃO EM PIXEL
        ============================================================ */
        .animated-pixel-border {
            position: relative;
            background-color: var(--blue-deep);
            padding: 36px 24px;
            border: 6px solid #000;
            box-shadow: 0 0 0 6px var(--red-bright);
            animation: borderFlash 1.2s infinite steps(2);
        }

        @keyframes borderFlash {
            0% { box-shadow: 0 0 0 6px var(--red-bright), 0 0 24px var(--red-glow); border-color: var(--blue-mid); }
            50% { box-shadow: 0 0 0 6px var(--blue-light), 0 0 24px rgba(45, 74, 141, 0.6); border-color: var(--red-deep); }
            100% { box-shadow: 0 0 0 6px var(--red-bright), 0 0 24px var(--red-glow); border-color: var(--blue-mid); }
        }

        /* Coração em Pixel Art Puro */
        .pixel-heart {
            width: 140px;
            height: 120px;
            margin: 20px auto 28px auto;
            position: relative;
            animation: heartbeat 0.8s infinite steps(2);
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .final-title {
            font-size: 1.15rem;
            color: var(--red-bright);
            margin-bottom: 20px;
        }

        .final-text {
            font-size: 0.72rem;
            line-height: 2;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- ================= PÁGINA 1: INTRODUÇÃO ================= -->
        <div class="pixel-box active" id="page1">
            <h1>[ MISSÃO CHEGUE NO MEU CORAÇÃO ]</h1>
            <p>
                OI, MEU AMOR!<br><br>
                FIZ UM JOGUINHO PRA VOCÊ 🥹<br><br>
                O TEU OBJETIVO É SIMPLES:<br>
                CHEGUE ATÉ MEU CORAÇÃO.
            </p>
            <button class="pixel-btn" onclick="startGame()">▶ INICIAR JOGO</button>
        </div>

        <!-- ================= PÁGINA 2: O LABIRINTO ================= -->
        <div class="pixel-box" id="page2">
            <div class="maze-container">
                <div class="maze-header">
                    <span>FASE: 01</span>
                    <span>OBJETIVO: ❤️</span>
                </div>
                
                <canvas id="mazeCanvas" width="330" height="330"></canvas>

                <!-- Controlos no ecrã para telemóvel -->
                <div class="dpad">
                    <button class="dpad-btn dpad-up" onclick="movePlayer(0, -1)">▲</button>
                    <button class="dpad-btn dpad-left" onclick="movePlayer(-1, 0)">◀</button>
                    <button class="dpad-btn dpad-down" onclick="movePlayer(0, 1)">▼</button>
                    <button class="dpad-btn dpad-right" onclick="movePlayer(1, 0)">▶</button>
                </div>
                
                <p style="font-size: 0.55rem; color: #8e9bb5; margin: 6px 0 0 0;">
                    Usa as SETAS / W A S D ou toca nos botões
                </p>
            </div>
        </div>

        <!-- ================= PÁGINA 3: VITÓRIA / PRÉMIO ================= -->
        <div class="pixel-box" id="page3">
            <div class="animated-pixel-border">
                <!-- SVG desenhado com grelha de pixel art -->
                <div class="pixel-heart">
                    <svg viewBox="0 0 16 14" width="100%" height="100%" style="image-rendering: pixelated;">
                        <!-- Sombra escura -->
